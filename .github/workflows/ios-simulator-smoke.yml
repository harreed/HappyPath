name: iOS simulator smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    # A dedicated runner must have macOS 27, Xcode 27, and an installed iPhone simulator.
    runs-on: [self-hosted, macOS, ios-simulator, xcode-27]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/agentic-ci"
          swift test 2>&1 | tee "$RUNNER_TEMP/agentic-ci/unit-tests.log"
      - name: Run onboarding fixture on Simulator
        run: bash Scripts/ci_simulator_smoke.sh "$RUNNER_TEMP/agentic-ci"
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-run
          path: |
            ${{ runner.temp }}/agentic-ci/unit-tests.log
            ${{ runner.temp }}/agentic-ci/fixture-run/
          if-no-files-found: warn
